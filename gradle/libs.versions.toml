# Dependency versions for landmc-lobby.
#
# Only what the lobby adds on top of the platform. Okaeri, LiteCommands, Multification, Jedis,
# HikariCP, ORMLite and Adventure all arrive with the platform modules, so their versions are
# decided once, in landmc-platform's catalog.
[versions]

landmc-platform = "1.1.0"

# Paper 26.2 publishes Java 25 bytecode, which is why this project compiles with --release 25.
paper = "26.2.build.121-stable"

# The JDBC driver is the plugin's choice, not the platform's: platform-database ships none.
# H2 keeps a fresh lobby working with no database server to set up.
h2 = "2.4.240"

# The driver production actually runs on; H2 is the out-of-the-box fallback.
mariadb = "3.5.10"

packetevents = "2.13.0"
shadow = "9.6.1"

junit = "6.1.3"
slf4j = "2.0.17"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

platform-api = { module = "pl.landmc:platform-api", version.ref = "landmc-platform" }
platform-common = { module = "pl.landmc:platform-common", version.ref = "landmc-platform" }
platform-config = { module = "pl.landmc:platform-config", version.ref = "landmc-platform" }
platform-database = { module = "pl.landmc:platform-database", version.ref = "landmc-platform" }
platform-messaging = { module = "pl.landmc:platform-messaging", version.ref = "landmc-platform" }
platform-paper = { module = "pl.landmc:platform-paper", version.ref = "landmc-platform" }

h2 = { module = "com.h2database:h2", version.ref = "h2" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

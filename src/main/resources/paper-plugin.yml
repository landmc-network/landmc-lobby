name: landmc-lobby
version: '${version}'
main: pl.landmc.lobby.LandLobbyPlugin
api-version: '26.2'
description: Lobby sieci LandMC - spawn, profil gracza i komunikacja z proxy.

# Enabled before the worlds are loaded, because the default world's generator has to exist by
# the time the server creates it. A plugin enabled afterwards is too late, and the server says
# so: "Could not set generator for default world - is it load:STARTUP?".
#
# The cost is that nothing here may assume a world exists during onEnable, which is why the
# world settings are applied from ServerLoadEvent instead.
load: STARTUP
author: Crispi
website: https://github.com/landmc-network/landmc-lobby

dependencies:
  server:
    # Optional: packet integrations are prepared but nothing uses them yet, so a server
    # without PacketEvents must still load the lobby.
    packetevents:
      load: BEFORE
      required: false
      join-classpath: true

    # Optional too, and declared for the same reason it has to be declared at all: Paper gives
    # each plugin its own classloader, so a plugin that does not name another cannot see its
    # classes even when it is installed and running. Without this line the tab list asked for
    # LuckPerms, was told it was not there, and showed plain names on a server running it.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
